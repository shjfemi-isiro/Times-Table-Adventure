name: Production watch
# Twice a day: the live site still passes smoke and header checks.
on:
  schedule: [{ cron: '40 7,19 * * *' }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Smoke and headers
        env: { BASE_URL: '${{ vars.PROD_URL }}', EXPECT_ENV: production }
        run: node scripts/smoke.mjs && node scripts/check-headers.mjs
      - if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh issue create --title "Production watch failed $(date -u +%F)" --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
