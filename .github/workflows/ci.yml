name: CI
# Every pull request and push: tests against a real Postgres engine, migration
# safety, security headers, browser and accessibility checks, secret scanning,
# dependency audit. Nothing here deploys or touches a real database.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Migrations are expand-only
        run: npm run lint:migrations
      - name: Unit and integration tests (local Postgres engine)
        run: npm test
      - name: Build (production settings)
        run: npm run build
        env:
          APP_ENV: production
          CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA==
      - name: Browser and accessibility checks on the built site
        run: |
          npx playwright install --with-deps chromium
          node scripts/serve-dist.mjs dist 4599 &
          sleep 1
          BASE_URL=http://localhost:4599 npm run e2e
      - name: Dependency audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
